<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cetas Lite</title>
<style>
  :root { color-scheme: dark light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, sans-serif; background: #0b1220; color: #e6edf6; }
  main { text-align: center; }
  h1 { font-weight: 600; letter-spacing: .5px; }
  p { color: #8aa0bd; }
</style>
</head>
<body>
<main>
  <h1>Cetas Lite</h1>
  <p id="status">Socle actif — UI en construction.</p>
</main>
<script>
  fetch('/api/health').then(r => r.json())
    .then(d => { document.getElementById('status').textContent = 'Proxy ' + d.status; })
    .catch(() => {});
</script>
</body>
</html>
